<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bruna & Carlos | Lista de Presentes</title><meta name="theme-color" content="#b9532b"><style>
:root{--t:#b9532b;--d:#7f412d;--bg:#faf6f0;--line:#e9d6c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#463b34;font-family:Georgia,serif}header{text-align:center;background:#fff;padding-bottom:35px;border-bottom:1px solid var(--line)}.photo{width:100%;max-height:430px;object-fit:cover;object-position:center 44%;display:block}.intro{padding:26px 18px 0}.eyebrow{letter-spacing:3px;font:12px Arial,sans-serif;color:var(--t)}h1{font-size:clamp(38px,7vw,64px);font-weight:400;font-style:italic;color:var(--t);margin:8px 0}header p{line-height:1.65;max-width:540px;margin:14px auto;color:#806a5d}main{max-width:900px;margin:35px auto;padding:0 16px 60px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}input,select{border:1px solid #d7b9a6;border-radius:8px;padding:13px;font:15px Arial,sans-serif;background:#fff;max-width:100%}#search{flex:1;min-width:210px}.stats{font:13px Arial,sans-serif;color:#826657;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.gift{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;min-height:155px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 16px #8c5d3e0b}.gift h3{font-size:19px;font-weight:400;margin:8px 0 14px}.tag{font:11px Arial,sans-serif;letter-spacing:.3px;color:#3c7453}.tag.off{color:#8b7770}button{background:var(--t);color:white;border:0;border-radius:8px;padding:12px 15px;font:600 13px Arial,sans-serif;cursor:pointer}button:disabled{background:#e7ddd5;color:#827771;cursor:not-allowed}.notice{text-align:center;padding:30px;color:#806a5d}dialog{border:0;border-radius:16px;padding:26px;width:min(92vw,420px);box-shadow:0 15px 70px #0003}dialog::backdrop{background:#0008}dialog h2{color:var(--t);font-weight:400;margin-top:0}dialog input{width:100%;margin:12px 0}dialog menu{display:flex;justify-content:flex-end;gap:10px;padding:0;margin:12px 0 0}.secondary{background:#ede2d8;color:#5b4439}footer{text-align:center;color:#a38d7c;padding:25px;font:12px Arial,sans-serif}@media(max-width:600px){.photo{height:290px}.grid{grid-template-columns:1fr 1fr;gap:9px}.gift{padding:13px;min-height:160px}.gift h3{font-size:16px}.intro{padding-top:22px}}
</style></head><body><header><img class="photo" src="noivos.jpg" alt="Bruna e Carlos"><div class="intro"><div class="eyebrow">NOSSA LISTA DE PRESENTES</div><h1>Bruna & Carlos</h1><p>Sua presença é o nosso maior presente! Mas, se desejar nos presentear, escolha um item da nossa lista com muito carinho.</p></div></header><main><div class="toolbar"><input id="search" placeholder="Buscar presente..." aria-label="Buscar presente"><select id="filter" aria-label="Filtrar presentes"><option value="todos">Todos os presentes</option><option value="disponivel">Disponíveis</option><option value="indisponivel">Indisponíveis</option></select></div><div class="stats" id="stats">Carregando presentes...</div><div id="list" class="grid"></div><p class="notice" id="notice" hidden></p></main><dialog id="dialog"><form id="form"><h2>Reservar presente</h2><p id="chosen"></p><label for="guest">Seu nome</label><input id="guest" required minlength="2" maxlength="100" autocomplete="name" placeholder="Digite seu nome"><p id="message" role="status"></p><menu><button type="button" class="secondary" id="cancel">Cancelar</button><button id="confirm" type="submit">Confirmar presente</button></menu></form></dialog><footer>Com carinho, Bruna & Carlos</footer><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://ziqhqqogwhygpifnfnvu.supabase.co','sb_publishable_VctACA1BGNYV_wHrdMNuvg_ge87IJQW');
const list=document.querySelector('#list'),stats=document.querySelector('#stats'),notice=document.querySelector('#notice'),dialog=document.querySelector('#dialog');let items=[],selected=null,busy=false;
function draw(){const query=document.querySelector('#search').value.toLocaleLowerCase('pt-BR').trim(),filter=document.querySelector('#filter').value;list.replaceChildren();const shown=items.filter(p=>(filter==='todos'||p.status===filter)&&p.nome.toLocaleLowerCase('pt-BR').includes(query));stats.textContent=`${items.length} presentes • ${items.filter(p=>p.status==='disponivel').length} disponíveis • ${items.filter(p=>p.status==='indisponivel').length} indisponíveis`;notice.hidden=shown.length>0;notice.textContent='Nenhum presente encontrado.';for(const p of shown){const card=document.createElement('article');card.className='gift';const top=document.createElement('div');const tag=document.createElement('div');tag.className='tag'+(p.status==='indisponivel'?' off':'');tag.textContent=p.status==='disponivel'?'● Disponível':'● Indisponível';const title=document.createElement('h3');title.textContent=p.nome;top.append(tag,title);const btn=document.createElement('button');btn.textContent=p.status==='disponivel'?'Vou presentear':'Já escolhido';btn.disabled=p.status!=='disponivel';btn.addEventListener('click',()=>{selected=p;document.querySelector('#chosen').textContent=p.nome;document.querySelector('#guest').value='';document.querySelector('#message').textContent='';dialog.showModal()});card.append(top,btn);list.append(card)}}
async function load(){const {data,error}=await supabase.from('presentes').select('id,nome,status').order('id');if(error){stats.textContent='Não foi possível carregar a lista.';notice.hidden=false;notice.textContent='Tente atualizar a página em alguns instantes.';return}items=data||[];draw()}
document.querySelector('#search').addEventListener('input',draw);document.querySelector('#filter').addEventListener('change',draw);document.querySelector('#cancel').addEventListener('click',()=>dialog.close());document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();if(busy||!selected)return;const name=document.querySelector('#guest').value.trim();if(name.length<2)return;busy=true;const btn=document.querySelector('#confirm');btn.disabled=true;document.querySelector('#message').textContent='Confirmando...';try{const {data,error}=await supabase.rpc('reservar_presente',{p_id:selected.id,p_nome:name});if(error)throw error;if(data===true){dialog.close();await load();alert('Presente reservado com sucesso! Obrigado pelo carinho.')}else{dialog.close();await load();alert('Este presente já foi escolhido. Selecione outro disponível.')}}catch(err){document.querySelector('#message').textContent='Não foi possível confirmar. Tente novamente.'}finally{busy=false;btn.disabled=false}});load();
</script></body></html>
